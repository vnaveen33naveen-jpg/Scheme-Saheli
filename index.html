<style>
:root{--ink:#12373A;--teal:#0F6B68;--gold:#F4B63F;--rani:#C2185B;--bg:#EAF4F0;--card:#fff;--line:#BFD9D2;--soft:#FFF1CC}
@media (prefers-color-scheme:dark){:root{--ink:#E9F5F2;--teal:#5CC7C0;--bg:#0E2224;--card:#16373A;--line:#2D5A5C;--soft:#3A3318}}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Tamil","Noto Sans Telugu","Nirmala UI",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
#app{max-width:720px;margin:0 auto;padding:16px 16px 48px}
button{font:inherit;cursor:pointer;min-height:56px;border-radius:16px;border:2px solid var(--teal);background:var(--card);color:var(--ink);padding:10px 18px}
button:focus-visible,input:focus-visible{outline:4px solid var(--rani);outline-offset:2px}
h1,h2,h3{line-height:1.25;margin:0 0 .4em}
.brand{display:flex;align-items:center;gap:14px;margin:8px 0 16px}
.brand svg{width:84px;height:84px;flex:none}
.brand h1{font-size:1.9rem}
.brand p{margin:0;font-size:1.05rem}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.langs button{flex:1 1 40%;font-weight:700;padding:10px 8px}
@media (min-width:520px){.langs button{flex:1 1 0}}
.langs button[aria-pressed=true]{background:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.langs button[aria-pressed=true]{color:#0E2224}}
.big{width:100%;min-height:72px;font-size:1.3rem;font-weight:700;background:var(--rani);border-color:var(--rani);color:#fff;margin:6px 0 24px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.how{display:grid;gap:10px}
.how .card{display:flex;gap:14px;align-items:center;margin:0}
.how svg{width:52px;height:52px;flex:none}
.how b{font-size:1.1rem}
.row{display:flex;gap:8px;align-items:stretch}
.row .open{flex:1;text-align:left;border-color:var(--line)}
.row .open small{display:block;opacity:.75}
.del{color:var(--rani);border-color:var(--rani)}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.log{display:grid;gap:12px;margin:12px 0}
.msg{max-width:92%;padding:12px 16px;border-radius:20px;font-size:1.1rem}
.msg.bot{background:var(--card);border:2px solid var(--line);justify-self:start}
.msg.user{background:var(--teal);color:#fff;justify-self:end}
@media (prefers-color-scheme:dark){.msg.user{color:#0E2224}}
.msg ol{padding-left:1.3em;margin:.5em 0}
.msg li{margin-bottom:.4em}
.sample{background:var(--soft);border-left:6px solid var(--gold);padding:8px 12px;border-radius:10px;font-size:.9rem;margin-top:8px}
.msg .ls{min-height:44px;font-size:.95rem;margin-top:6px;padding:4px 14px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.chips button{font-weight:700;font-size:1.05rem}
.input{display:flex;gap:8px;margin-top:12px}
.input input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:16px;border:2px solid var(--teal);background:var(--card);color:var(--ink)}
.input .send{background:var(--teal);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){.input .send{color:#0E2224}}
.micwrap{text-align:center;margin:16px 0}
.mic{width:92px;height:92px;border-radius:50%;background:var(--rani);border-color:var(--rani);padding:0}
.mic svg{width:44px;height:44px}
.mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 16px rgba(194,24,91,.25)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none;outline:6px solid var(--gold)}}
.note{min-height:1.5em;font-weight:600;color:var(--rani);text-align:center}
.saved{text-align:center;font-size:.95rem;opacity:.85}
h2:focus{outline:none}
.dlgback{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dlgback[hidden]{display:none}
.dlg{background:var(--card);color:var(--ink);border:3px solid var(--rani);border-radius:20px;padding:20px;max-width:420px;width:100%}
.dlg p{margin:0 0 16px;font-size:1rem;word-break:break-word}
.dlgbtns{display:flex;gap:10px}
.dlgbtns button{flex:1;font-weight:700}
.dlgbtns .danger{background:var(--rani);border-color:var(--rani);color:#fff}
.step{display:grid;gap:8px}
.step h3{font-size:1.15rem;margin:0}
.step svg{width:100%;max-width:260px;height:auto;justify-self:center}
.step p{margin:0}
.num{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--rani);color:#fff;font-size:.9em;margin-right:6px}
.stl{margin:.4em 0 0;padding-left:1.2em}
.stl li{margin-bottom:.4em}
.mic[aria-busy=true]{opacity:.7}
#app{padding-bottom:110px}
#stopbar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5;pointer-events:none}
#stopbar[hidden]{display:none}
#stopbar button{pointer-events:auto;background:var(--rani);border-color:var(--rani);color:#fff;font-weight:700;font-size:1.15rem;min-width:240px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.msg h3{font-size:1.15rem}
.sh{font-size:1rem;margin:.9em 0 .3em}
.hint{font-size:.85rem;opacity:.85;margin:.2em 0 .6em}
.chk-list{display:grid;gap:8px}
.chk{display:flex;gap:12px;align-items:center;text-align:left;width:100%;font-size:1rem;padding:8px 12px;min-height:56px}
.chk .box{flex:none;width:30px;height:30px;border:3px solid var(--teal);border-radius:8px;display:grid;place-items:center;font-weight:900;background:var(--card)}
.chk.on{background:var(--soft);border-color:var(--rani)}
.chk.on .box{background:var(--rani);border-color:var(--rani);color:#fff}
.callbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;margin-top:10px;border:2px solid var(--rani);border-radius:16px;color:var(--rani);font-weight:700;text-decoration:none;padding:8px 14px;text-align:center}
.callbtn:focus-visible{outline:4px solid var(--rani);outline-offset:2px}
.count{font-weight:700;margin:.6em 0 .2em}
.msg .chips button{font-size:.95rem;min-height:48px}
.tintro{margin:0 0 12px}
.tgrid{display:grid;gap:12px;margin:12px 0 20px}
@media (min-width:560px){.tgrid{grid-template-columns:1fr 1fr}}
.tcard{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:104px;padding:14px 16px;border-radius:20px;border-color:var(--line)}
.tcard:hover,.tcard:active{border-color:var(--teal);background:var(--soft)}
.tcard svg{width:56px;height:56px;flex:none}
.tcard .tx{display:block}
.tcard b{display:block;font-size:1.15rem;line-height:1.25}
.tcard .tx span{display:block;font-size:.95rem;opacity:.85;margin-top:2px}
</style>
</head>

function setTts(t){ttsWarn=t;const e=$('#tts');if(e)e.textContent=t}
let speaking=false,spLang='en',spId=0,spStart=0;
function setSpeaking(b,l){
 speaking=b;if(l)spLang=l;
 const bar=$('#stopbar');if(!bar)return;
 bar.hidden=!b;
 if(b)$('#stopSpeak').textContent='⏹ '+T[spLang].stopSpeak;
}
function stopSpeech(){spId++;setSpeaking(false);if(SYN)speechSynthesis.cancel()}
setInterval(()=>{if(speaking&&SYN&&Date.now()-spStart>2500&&!speechSynthesis.speaking&&!speechSynthesis.pending)setSpeaking(false)},600);
function findVoice(l){
 if(!SYN)return null;
 const norm=x=>(x||'').replace('_','-').toLowerCase(),vs=speechSynthesis.getVoices();
 return vs.find(v=>norm(v.lang)===LC[l].toLowerCase())||vs.find(v=>norm(v.lang).split('-')[0]===l)||null;
}
function speak(text,l){
 stopSpeech();const u=T[l];
 if(!SYN){setTts(u.noSyn);return}
 setTts('');
 const my=spId;spStart=Date.now();setSpeaking(true,l);
 const run=()=>{
  if(my!==spId)return;
  const v=findVoice(l);
  if(!v){setTts(u.noTts);setSpeaking(false);return}
  const ut=new SpeechSynthesisUtterance(text);ut.voice=v;ut.lang=v.lang;ut.rate=.9;
  ut.onend=()=>{if(my===spId)setSpeaking(false)};
  ut.onerror=ev=>{if(my===spId)setSpeaking(false);if(ev.error!=='canceled'&&ev.error!=='interrupted')setTts(u.ttsFail)};
  speechSynthesis.speak(ut);
 };
 if(speechSynthesis.getVoices().length)run();
 else{let d=false;const f=()=>{if(d)return;d=true;speechSynthesis.removeEventListener('voiceschanged',f);run()};speechSynthesis.addEventListener('voiceschanged',f);setTimeout(f,1500)}
}

}

 if(m.ex||m.tp)h+='<div class="sample" style="margin:0 0 8px"><b>⚠ '+esc(c.notice)+'</b>'+(m.schemes?'<br>'+esc(u.schLbl)+' <b>'+esc(m.schemes)+'</b>':'')+'</div>';
 if(m.title)h+='<h3>'+esc(m.title)+'</h3>';
 h+=esc(m.t);
 if(m.steps){if(m.docs)h+='<h4 class="sh">'+esc(u.stepsTitle)+'</h4>';h+='<ol>'+m.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>'}
 if(m.docs){
  const ck=m.checked||[],n=m.docs.filter((d,j)=>ck[j]).length;
  h+='<h4 class="sh">'+esc(u.docsTitle)+'</h4><p class="hint">'+esc(u.docsHint)+'</p><div class="chk-list" role="group" aria-label="'+esc(u.docsTitle)+'">'
   +m.docs.map((d,j)=>{const on=!!ck[j];return '<button type="button" class="chk'+(on?' on':'')+'" role="checkbox" aria-checked="'+on+'" data-act="chk" data-i="'+i+'" data-j="'+j+'"><span class="box" aria-hidden="true">'+(on?'✔':'')+'</span><span>'+esc(d)+'</span></button>'}).join('')+'</div>'
   +'<div class="count">'+esc(u.ready.replace('{n}',n).replace('{m}',m.docs.length))+'</div>'
   +'<div class="sample">'+esc(c.documentsNote)+'</div>'
   +'<div class="chips"><button type="button" data-act="copy" data-i="'+i+'">📋 '+esc(u.copy)+'</button><button type="button" data-act="wa" data-i="'+i+'">💬 '+esc(u.share)+'</button></div><div class="note cn" role="status"></div>';
 }
 if(m.note)h+='<div class="sample"><b>'+esc(u.sampleTag)+':</b> '+esc(c.disclaimer)+'</div>';
 if((m.ex||m.tp)&&c.helpline)h+='<a class="callbtn" href="'+esc(c.helpline.tel)+'">📞 '+esc(c.helpline.callLabel)+'</a><p class="hint">'+esc(c.helpline.note)+'</p>';
 if(m.r==='bot')h+='<br><button class="ls" data-act="listen" data-i="'+i+'" aria-label="'+esc(u.listen)+'">🔊 '+esc(u.listen)+'</button>';
 return h+'</div>';
}

pension:['पेंशन','बुज़ुर्गों, विधवाओं और दिव्यांगजनों के लिए सहायता।','पेंशन योजनाएँ शर्तें पूरी करने वाले बुज़ुर्गों, विधवाओं और दिव्यांगजनों को हर महीने राशि देती हैं।',['पता करें कि कौन-सी पेंशन आपके लिए है: वृद्धावस्था, विधवा या दिव्यांग।','ग्राम पंचायत, वार्ड या तहसील कार्यालय से आवेदन का तरीका पूछें और रसीद लें।','पेंशन जमा होने के लिए बैंक खाता चालू रखें।'],['आधार कार्ड','आयु प्रमाण (जन्म, स्कूल या मतदाता पहचान पत्र)','बैंक पासबुक','पति का मृत्यु प्रमाण पत्र (विधवा पेंशन)','विकलांगता प्रमाण पत्र (दिव्यांग पेंशन)']],
ration:['राशन सहायता','राशन कार्ड, सस्ता अनाज और सुधार।','राशन कार्ड से परिवार सस्ता अनाज ले सकता है और यह पहचान पत्र भी है। आप कार्ड बनवा सकते हैं या नाम और विवरण सुधरवा सकते हैं।',['देखें कि परिवार का राशन कार्ड है और नाम सही हैं।','नए कार्ड या बदलाव के लिए तहसील आपूर्ति कार्यालय या राज्य की खाद्य आपूर्ति वेबसाइट देखें।','पूछे जाने पर राशन की दुकान पर आधार जोड़ें या फ़िंगरप्रिंट (ई-केवाईसी) कराएँ; रसीद रखें।'],['सभी सदस्यों के आधार कार्ड','पते का प्रमाण (बिजली बिल, किराया समझौता)','पासपोर्ट आकार की फ़ोटो','जन्म या विवाह प्रमाण पत्र (सदस्य जोड़ने के लिए)','पुराना राशन कार्ड (सुधार के लिए)']],
housing:['आवास','घर बनाने, खरीदने या मरम्मत में मदद।','आवास योजनाएँ पक्का घर न रखने वाले परिवारों को आर्थिक मदद देती हैं। ग्रामीण और शहरी योजनाएँ अलग हैं और नियम राज्य के अनुसार बदलते हैं।',['देखें कि आपका क्षेत्र ग्रामीण (ग्राम पंचायत) है या शहरी (नगरपालिका)।','स्थानीय कार्यालय से पूछें कि परिवार लाभार्थी सूची में है या नहीं, और नहीं तो आवेदन कैसे करें।','ज़मीन या मकान की जगह का प्रमाण तैयार रखें और हर रसीद सँभालें।'],['आधार कार्ड','बैंक पासबुक','ज़मीन का दस्तावेज़, पट्टा या जगह का प्रमाण','राशन कार्ड या आय प्रमाण','जाति प्रमाण पत्र (यदि लागू हो)']],
farming:['खेती','आय सहायता, फसल बीमा, ऋण और सलाह।','किसान आय सहायता, फसल बीमा, कम ब्याज के ऋण और मुफ़्त सलाह पा सकते हैं। आमतौर पर पहला कदम ज़मीन के विवरण के साथ पंजीकरण है।',['जाँचें कि ज़मीन का रिकॉर्ड आपके नाम पर और अद्यतन है।','कृषि कार्यालय या जन सेवा केंद्र पर पीएम-किसान के लिए पंजीकरण और ई-केवाईसी कराएँ।','बैंक से किसान क्रेडिट कार्ड और कृषि कार्यालय से बुवाई खत्म होने से पहले फसल बीमा के बारे में पूछें।'],['आधार कार्ड','ज़मीन का रिकॉर्ड (पट्टा, खतौनी या ऐसा ही)','बैंक पासबुक','आधार से जुड़ा मोबाइल नंबर','फसल या बुवाई का विवरण (बीमा के लिए)']],
shg:['स्वयं सहायता समूह और छोटा व्यवसाय','महिला समूह, ऋण और छोटा व्यवसाय शुरू करना।','स्वयं सहायता समूह में महिलाएँ मिलकर बचत करती हैं, कम ब्याज पर ऋण लेती हैं और बैंक व आजीविका मिशन की मदद से छोटा व्यवसाय शुरू करती हैं।',['अपने गाँव के समूह से जुड़ें या 10 से 20 महिलाओं का नया समूह बनाएँ।','नियमित बैठक और बचत करें, रिकॉर्ड की किताब रखें और समूह का बैंक खाता खोलें।','कुछ महीनों बाद बैंक या ब्लॉक कार्यालय से समूह ऋण, या अपने व्यवसाय के लिए मुद्रा ऋण के बारे में पूछें।'],['सभी सदस्यों के आधार कार्ड','पासपोर्ट आकार की फ़ोटो','बचत और बैठक का रिकॉर्ड','समूह की बैंक पासबुक','व्यवसाय की सरल योजना और ज़रूरी राशि']]}},
ta:{u:{title:'உதவித் தலைப்பைத் தேர்ந்தெடுங்கள்',sub:'ஒரு தலைப்பைத் தொடுங்கள். அடுத்த படிகளையும் ஆவணப் பட்டியலையும் காட்டுகிறேன்.',own:'அல்லது உங்கள் சொற்களில் கேளுங்கள்',call:'உதவி எண்ணை அழையுங்கள்',notice:'மாதிரித் தகவல் மட்டுமே. விதிகளும் தொகைகளும் மாநிலத்துக்கு ஏற்ப மாறும்; மாறவும் கூடும். உள்ளூர் அலுவலகத்தில் உறுதிசெய்யுங்கள்.',disclaimer:'இது பொதுவான மாதிரி வழிகாட்டல்; தகுதிக்கான அதிகாரப்பூர்வ முடிவு அல்ல.',docsNote:'தேவையான ஆவணங்கள் திட்டத்துக்கும் மாநிலத்துக்கும் ஏற்ப மாறலாம். அலுவலகத்தில் கேளுங்கள்.'},t:{
education:['கல்வி உதவி','உதவித்தொகை, கட்டணம், படிப்பைத் தொடர உதவி.','உதவித்தொகையும் கட்டண உதவியும் மாணவர்கள் பள்ளி, கல்லூரியில் படிப்பைத் தொடர உதவும். விதிகளும் தொகையும் திட்டத்துக்கும் மாநிலத்துக்கும் ஏற்ப மாறும்.',['எந்த உதவித்தொகைகள் பொருந்தும் என்று பள்ளி அல்லது கல்லூரியில் கேளுங்கள்.','கடைசித் தேதி, வருமான அல்லது பிரிவு வரம்புகளைப் பாருங்கள்.','பள்ளி அல்லது பொது சேவை மையத்தின் உதவியுடன் இணையத்தில் விண்ணப்பித்து, விண்ணப்ப எண்ணை வைத்துக்கொள்ளுங்கள்.'],['மாணவரின் ஆதார் அட்டை','வங்கிப் புத்தகம் (மாணவரின் கணக்கு)','மதிப்பெண் பட்டியல் அல்லது கடந்த ஆண்டு முடிவு','வருமானச் சான்றிதழ்','சாதிச் சான்றிதழ் (பொருந்தினால்)']],
work:['வேலை மற்றும் திறன்','வேலைவாய்ப்பு, இலவசப் பயிற்சி, கிராமப்புற வேலை.','வேலை, இலவசத் திறன் பயிற்சி, கிராமப்புறக் கூலி வேலை ஆகியவற்றைத் தேடலாம். பயிற்சிச் சான்றிதழ் வேலை கிடைக்க உதவும்.',['எந்த வேலை அல்லது பயிற்சி வேண்டும் என்று முடிவுசெய்யுங்கள்; எ.கா. தையல், கணினி அடிப்படைகள்.','தேசிய தொழில் சேவை இணையதளத்தில் பதிவுசெய்யுங்கள், அல்லது அருகிலுள்ள வேலைவாய்ப்பு அலுவலகத்தில் கேளுங்கள்.','கிராமப்புறக் கூலி வேலைக்கு வேலை அட்டை பற்றி கிராம ஊராட்சியில் கேளுங்கள்.'],['ஆதார் அட்டை','வங்கிப் புத்தகம்','கல்விச் சான்றிதழ்கள் (இருந்தால்)','பாஸ்போர்ட் அளவு புகைப்படங்கள்','ஆதாருடன் இணைந்த கைபேசி எண்']],
health:['உடல்நலம் மற்றும் மகப்பேறு','கர்ப்பம், பிரசவம், குழந்தை நலம், காப்பீடு.','அரசு மருத்துவமனைகள் கர்ப்பகாலத்திலும் பிரசவத்திலும் இலவசப் பரிசோதனை தருகின்றன. சில திட்டங்கள் தாய்மார்களுக்குப் பண உதவி தருகின்றன; ஆயுஷ்மான் பாரத் மருத்துவமனைச் செலவை ஏற்கலாம்.',['கர்ப்பத்தை முன்கூட்டியே அருகிலுள்ள சுகாதார நிலையம் அல்லது அங்கன்வாடியில் பதிவுசெய்யுங்கள்.','எல்லாப் பரிசோதனைகளுக்கும் செல்லுங்கள்; தாய்–சேய் பாதுகாப்பு அட்டையைப் பத்திரமாக வையுங்கள்.','அரசு மருத்துவமனையில் பிரசவத்துக்குத் திட்டமிட்டு, பிரசவ உதவி மற்றும் ஆயுஷ்மான் பாரத் அட்டை பற்றிக் கேளுங்கள்.'],['ஆதார் அட்டை','வங்கிப் புத்தகம் (உங்கள் பெயரில்)','கர்ப்பப் பதிவுச் சீட்டு அல்லது MCP அட்டை','குடும்ப அட்டை அல்லது குடும்பச் சான்று','ஆதாருடன் இணைந்த கைபேசி எண்']],
pension:['ஓய்வூதியம்','முதியோர், விதவைகள், மாற்றுத்திறனாளிகளுக்கு உதவி.','நிபந்தனைகளைப் பூர்த்தி செய்யும் முதியோர், விதவைகள், மாற்றுத்திறனாளிகளுக்கு ஓய்வூதியத் திட்டங்கள் மாதந்தோறும் தொகை வழங்குகின்றன.',['முதியோர், விதவை, மாற்றுத்திறனாளி என எந்த ஓய்வூதியம் பொருந்தும் என்று அறியுங்கள்.','கிராம ஊராட்சி, வார்டு அல்லது வட்ட அலுவலகத்தில் விண்ணப்ப முறையைக் கேட்டு, ரசீது பெறுங்கள்.','ஓய்வூதியம் செலுத்த வங்கிக் கணக்கைச் செயலில் வைத்திருங்கள்.'],['ஆதார் அட்டை','வயதுச் சான்று (பிறப்பு, பள்ளி அல்லது வாக்காளர் அட்டை)','வங்கிப் புத்தகம்','கணவரின் இறப்புச் சான்றிதழ் (விதவை ஓய்வூதியம்)','மாற்றுத்திறனாளிச் சான்றிதழ் (மாற்றுத்திறனாளி ஓய்வூதியம்)']],
ration:['ரேஷன் உதவி','குடும்ப அட்டை, மானிய உணவுப் பொருள், திருத்தம்.','குடும்ப அட்டை மூலம் மானிய விலையில் உணவுப் பொருள் வாங்கலாம்; அது அடையாள அட்டையாகவும் பயன்படும். புதிய அட்டைக்கு விண்ணப்பிக்கலாம்; பெயர், விவரங்களைத் திருத்தலாம்.',['குடும்ப அட்டை உள்ளதா, பெயர்கள் சரியா என்று பாருங்கள்.','புதிய அட்டை அல்லது மாற்றத்துக்கு வட்ட வழங்கல் அலுவலகம் அல்லது மாநில உணவு வழங்கல் இணையதளத்தைப் பாருங்கள்.','கேட்டால், ரேஷன் கடையில் ஆதார் இணைப்பு அல்லது கைரேகைச் சரிபார்ப்பை (e-KYC) முடித்து, ரசீதை வைத்துக்கொள்ளுங்கள்.'],['எல்லா உறுப்பினர்களின் ஆதார் அட்டைகள்','முகவரிச் சான்று (மின்கட்டண ரசீது, வாடகை ஒப்பந்தம்)','பாஸ்போர்ட் அளவு புகைப்படங்கள்','பிறப்பு அல்லது திருமணச் சான்றிதழ் (உறுப்பினரைச் சேர்க்க)','பழைய குடும்ப அட்டை (திருத்தத்துக்கு)']],
housing:['வீட்டுவசதி','வீடு கட்ட, வாங்க, பழுதுபார்க்க உதவி.','நிரந்தர (பக்கா) வீடு இல்லாத குடும்பங்களுக்கு வீட்டுவசதித் திட்டங்கள் நிதி உதவி தருகின்றன. கிராமப்புறத்துக்கும் நகர்ப்புறத்துக்கும் தனித் திட்டங்கள்; விதிகள் மாநிலத்துக்கு ஏற்ப மாறும்.',['உங்கள் பகுதி கிராமப்புறமா (ஊராட்சி) நகர்ப்புறமா (நகராட்சி) என்று பாருங்கள்.','உங்கள் குடும்பம் பயனாளிகள் பட்டியலில் உள்ளதா, இல்லையெனில் எப்படி விண்ணப்பிப்பது என்று உள்ளூர் அலுவலகத்தில் கேளுங்கள்.','நிலம் அல்லது வீட்டுமனைச் சான்றைத் தயாராக வைத்து, ஒவ்வொரு ரசீதையும் பத்திரப்படுத்துங்கள்.'],['ஆதார் அட்டை','வங்கிப் புத்தகம்','நில ஆவணம், பட்டா அல்லது மனைச் சான்று','குடும்ப அட்டை அல்லது வருமானச் சான்று','சாதிச் சான்றிதழ் (பொருந்தினால்)']],
farming:['விவசாயம்','வருமான உதவி, பயிர்க் காப்பீடு, கடன், ஆலோசனை.','விவசாயிகள் வருமான உதவி, பயிர்க் காப்பீடு, குறைந்த வட்டிக் கடன், இலவச ஆலோசனை பெறலாம். பொதுவாக முதல் படி, நில விவரங்களுடன் பதிவுசெய்வது.',['உங்கள் நிலப் பதிவேடு உங்கள் பெயரில் புதுப்பிக்கப்பட்டுள்ளதா என்று பாருங்கள்.','வேளாண்மை அலுவலகம் அல்லது பொது சேவை மையத்தில் பிஎம்-கிசானுக்குப் பதிவுசெய்து e-KYC முடியுங்கள்.','வங்கியில் கிசான் கிரெடிட் கார்டு பற்றியும், விதைப்பு முடியும் முன் வேளாண்மை அலுவலகத்தில் பயிர்க் காப்பீடு பற்றியும் கேளுங்கள்.'],['ஆதார் அட்டை','நிலப் பதிவேடு (பட்டா, சிட்டா போன்றவை)','வங்கிப் புத்தகம்','ஆதாருடன் இணைந்த கைபேசி எண்','பயிர் அல்லது விதைப்பு விவரம் (காப்பீட்டுக்கு)']],
shg:['சுய உதவிக் குழுக்கள் மற்றும் சிறு தொழில்','மகளிர் குழு, கடன், சிறு தொழில் தொடக்கம்.','சுய உதவிக் குழுவில் பெண்கள் சேர்ந்து சேமிக்கலாம், குறைந்த வட்டிக்குக் கடன் பெறலாம், வங்கி மற்றும் வாழ்வாதார இயக்க உதவியுடன் சிறு தொழில் தொடங்கலாம்.',['உங்கள் ஊரில் உள்ள குழுவில் சேருங்கள், அல்லது 10 முதல் 20 பெண்களுடன் புதிய குழுவைத் தொடங்குங்கள்.','தவறாமல் கூடிச் சேமியுங்கள், பதிவேடு வையுங்கள், குழுவுக்கு வங்கிக் கணக்கு தொடங்குங்கள்.','சில மாதங்களுக்குப் பின், குழுக் கடன் அல்லது சொந்தத் தொழிலுக்கான முத்ரா கடன் பற்றி வங்கி அல்லது வட்டார அலுவலகத்தில் கேளுங்கள்.'],['எல்லா உறுப்பினர்களின் ஆதார் அட்டைகள்','பாஸ்போர்ட் அளவு புகைப்படங்கள்','சேமிப்பு, கூட்டப் பதிவேடு','குழு வங்கிப் புத்தகம்','எளிய தொழில் திட்டமும் தேவையான தொகையும்']]}},
te:{u:{title:'సహాయ అంశాన్ని ఎంచుకోండి',sub:'ఒక అంశాన్ని నొక్కండి. తదుపరి అడుగులు, పత్రాల జాబితా చూపిస్తాను.',own:'లేదా మీ మాటల్లో అడగండి',call:'హెల్ప్‌లైన్‌కు కాల్ చేయండి',notice:'నమూనా సమాచారం మాత్రమే. నియమాలు, మొత్తాలు రాష్ట్రాన్ని బట్టి మారతాయి, మారవచ్చు కూడా. స్థానిక కార్యాలయంలో నిర్ధారించుకోండి.',disclaimer:'ఇది సాధారణ నమూనా మార్గదర్శకం; అర్హతపై అధికారిక నిర్ణయం కాదు.',docsNote:'అవసరమైన పత్రాలు పథకాన్ని, రాష్ట్రాన్ని బట్టి మారవచ్చు. కార్యాలయంలో అడగండి.'},t:{
education:['విద్యా సహాయం','స్కాలర్‌షిప్‌లు, ఫీజులు, చదువుకు సహాయం.','స్కాలర్‌షిప్‌లు, ఫీజు సహాయం విద్యార్థులు స్కూల్, కాలేజీలో చదువు కొనసాగించడానికి తోడ్పడతాయి. నియమాలు, మొత్తాలు పథకాన్ని, రాష్ట్రాన్ని బట్టి మారతాయి.',['ఏ స్కాలర్‌షిప్‌లు వర్తిస్తాయో మీ స్కూల్ లేదా కాలేజీలో అడగండి.','చివరి తేదీ, ఆదాయం లేదా వర్గం పరిమితులు చూడండి.','స్కూల్ లేదా కామన్ సర్వీస్ సెంటర్ సహాయంతో ఆన్‌లైన్‌లో దరఖాస్తు చేసి, దరఖాస్తు నంబరు ఉంచుకోండి.'],['విద్యార్థి ఆధార్ కార్డు','బ్యాంకు పాస్‌బుక్ (విద్యార్థి ఖాతా)','మార్కుల పత్రం లేదా గత ఫలితం','ఆదాయ ధృవీకరణ పత్రం','కుల ధృవీకరణ పత్రం (వర్తిస్తే)']],
work:['ఉపాధి మరియు నైపుణ్యాలు','ఉద్యోగాలు, ఉచిత శిక్షణ, గ్రామీణ పని.','ఉద్యోగాలు, ఉచిత నైపుణ్య శిక్షణ, గ్రామీణ కూలీ పని కోసం వెతకవచ్చు. శిక్షణ సర్టిఫికెట్ పని దొరకడానికి సహాయపడుతుంది.',['ఏ పని లేదా శిక్షణ కావాలో నిర్ణయించుకోండి, ఉదా. కుట్టుపని, కంప్యూటర్ ప్రాథమికాలు.','జాతీయ కెరీర్ సర్వీస్ పోర్టల్‌లో నమోదు చేసుకోండి, లేదా సమీప ఉపాధి కార్యాలయంలో అడగండి.','గ్రామీణ కూలీ పని కోసం జాబ్ కార్డు గురించి గ్రామ పంచాయతీలో అడగండి.'],['ఆధార్ కార్డు','బ్యాంకు పాస్‌బుక్','విద్యా ధృవపత్రాలు (ఉంటే)','పాస్‌పోర్ట్ సైజు ఫోటోలు','ఆధార్‌కు లింక్ అయిన మొబైల్ నంబరు']],
health:['ఆరోగ్యం మరియు ప్రసూతి','గర్భం, ప్రసవం, పిల్లల ఆరోగ్యం, బీమా.','ప్రభుత్వ ఆసుపత్రులు గర్భధారణలో, ప్రసవంలో ఉచిత పరీక్షలు ఇస్తాయి. కొన్ని పథకాలు తల్లులకు ఆర్థిక సహాయం ఇస్తాయి; ఆయుష్మాన్ భారత్ ఆసుపత్రి ఖర్చును భరించవచ్చు.',['గర్భాన్ని ముందుగానే సమీప ఆరోగ్య కేంద్రంలో లేదా అంగన్‌వాడీలో నమోదు చేయించండి.','అన్ని పరీక్షలకు వెళ్లండి; తల్లి–బిడ్డ రక్షణ కార్డును భద్రంగా ఉంచండి.','ప్రభుత్వ ఆసుపత్రిలో ప్రసవానికి ప్లాన్ చేసి, ప్రసవ సహాయం, ఆయుష్మాన్ భారత్ కార్డు గురించి అడగండి.'],['ఆధార్ కార్డు','బ్యాంకు పాస్‌బుక్ (మీ పేరు మీద)','గర్భ నమోదు స్లిప్ లేదా MCP కార్డు','రేషన్ కార్డు లేదా కుటుంబ రుజువు','ఆధార్‌కు లింక్ అయిన మొబైల్ నంబరు']],
pension:['పింఛన్లు','వృద్ధులు, వితంతువులు, దివ్యాంగులకు సహాయం.','షరతులు తీర్చే వృద్ధులు, వితంతువులు, దివ్యాంగులకు పింఛన్ పథకాలు ప్రతి నెలా నిర్ణీత మొత్తం ఇస్తాయి.',['వృద్ధాప్య, వితంతు, దివ్యాంగ పింఛన్లలో మీకు ఏది సరిపోతుందో తెలుసుకోండి.','గ్రామ పంచాయతీ, వార్డు లేదా తహశీల్దార్ కార్యాలయంలో దరఖాస్తు విధానం అడిగి, రసీదు తీసుకోండి.','పింఛన్ జమ కావడానికి బ్యాంకు ఖాతాను పనిచేసేలా ఉంచండి.'],['ఆధార్ కార్డు','వయసు రుజువు (జనన, స్కూల్ సర్టిఫికెట్ లేదా ఓటరు కార్డు)','బ్యాంకు పాస్‌బుక్','భర్త మరణ ధృవీకరణ పత్రం (వితంతు పింఛన్)','దివ్యాంగ ధృవీకరణ పత్రం (దివ్యాంగ పింఛన్)']],
ration:['రేషన్ సహాయం','రేషన్ కార్డు, సబ్సిడీ ధాన్యం, సవరణలు.','రేషన్ కార్డుతో కుటుంబం సబ్సిడీ ధరకు ధాన్యాలు పొందవచ్చు; ఇది గుర్తింపు కార్డుగా కూడా పనిచేస్తుంది. కొత్త కార్డుకు దరఖాస్తు చేయవచ్చు, పేర్లు, వివరాలు సరిచేయించవచ్చు.',['కుటుంబానికి రేషన్ కార్డు ఉందో, పేర్లు సరిగా ఉన్నాయో చూడండి.','కొత్త కార్డు లేదా మార్పుల కోసం తహశీల్దార్ సరఫరా కార్యాలయం లేదా రాష్ట్ర పౌర సరఫరాల వెబ్‌సైట్ చూడండి.','అడిగితే రేషన్ దుకాణంలో ఆధార్ లింకింగ్ లేదా వేలిముద్ర (e-KYC) పూర్తి చేసి, రసీదు ఉంచుకోండి.'],['సభ్యులందరి ఆధార్ కార్డులు','చిరునామా రుజువు (కరెంటు బిల్లు, అద్దె ఒప్పందం)','పాస్‌పోర్ట్ సైజు ఫోటోలు','జనన లేదా వివాహ ధృవీకరణ పత్రం (సభ్యుడిని చేర్చడానికి)','పాత రేషన్ కార్డు (సవరణ కోసం)']],
housing:['గృహ నిర్మాణం','ఇల్లు కట్టుకోవడానికి, కొనడానికి, మరమ్మతుకు సహాయం.','పక్కా ఇల్లు లేని కుటుంబాలకు గృహ పథకాలు ఆర్థిక సహాయం ఇస్తాయి. గ్రామీణ, పట్టణ పథకాలు వేరు; నియమాలు రాష్ట్రాన్ని బట్టి మారతాయి.',['మీ ప్రాంతం గ్రామీణమా (గ్రామ పంచాయతీ) పట్టణమా (మున్సిపాలిటీ) చూడండి.','మీ కుటుంబం లబ్ధిదారుల జాబితాలో ఉందో, లేకపోతే ఎలా దరఖాస్తు చేయాలో స్థానిక కార్యాలయంలో అడగండి.','భూమి లేదా ఇంటి స్థలం రుజువు సిద్ధంగా ఉంచి, ప్రతి రసీదు భద్రపరచండి.'],['ఆధార్ కార్డు','బ్యాంకు పాస్‌బుక్','భూమి పత్రం, పట్టా లేదా స్థలం రుజువు','రేషన్ కార్డు లేదా ఆదాయ రుజువు','కుల ధృవీకరణ పత్రం (వర్తిస్తే)']],
farming:['వ్యవసాయం','ఆదాయ సహాయం, పంటల బీమా, రుణాలు, సలహా.','రైతులు ఆదాయ సహాయం, పంటల బీమా, తక్కువ వడ్డీ రుణాలు, ఉచిత సలహా పొందవచ్చు. సాధారణంగా మొదటి అడుగు భూమి వివరాలతో నమోదు చేసుకోవడం.',['భూమి రికార్డు మీ పేరు మీద, తాజాగా ఉందో చూడండి.','వ్యవసాయ కార్యాలయం లేదా కామన్ సర్వీస్ సెంటర్‌లో పీఎం-కిసాన్ కోసం నమోదు చేసుకుని e-KYC పూర్తి చేయండి.','బ్యాంకులో కిసాన్ క్రెడిట్ కార్డు గురించి, విత్తనాలు వేసే కాలం ముగిసేలోపు వ్యవసాయ కార్యాలయంలో పంటల బీమా గురించి అడగండి.'],['ఆధార్ కార్డు','భూమి రికార్డు (పట్టా, పాస్‌బుక్ వంటివి)','బ్యాంకు పాస్‌బుక్','ఆధార్‌కు లింక్ అయిన మొబైల్ నంబరు','పంట లేదా విత్తన వివరాలు (బీమా కోసం)']],
shg:['స్వయం సహాయక సంఘాలు మరియు చిన్న వ్యాపారం','మహిళా సంఘం, రుణాలు, చిన్న వ్యాపారం.','స్వయం సహాయక సంఘంలో మహిళలు కలిసి పొదుపు చేసి, తక్కువ వడ్డీకి రుణం తీసుకుని, బ్యాంకు, జీవనోపాధి మిషన్ సహాయంతో చిన్న వ్యాపారం మొదలుపెట్టవచ్చు.',['మీ గ్రామంలోని సంఘంలో చేరండి, లేదా 10 నుంచి 20 మంది మహిళలతో కొత్త సంఘం ఏర్పాటు చేయండి.','క్రమం తప్పక సమావేశమై పొదుపు చేయండి, రికార్డు పుస్తకం ఉంచండి, సంఘం బ్యాంకు ఖాతా తెరవండి.','కొన్ని నెలల తర్వాత సంఘ రుణం లేదా సొంత వ్యాపారానికి ముద్ర రుణం గురించి బ్యాంకు లేదా మండల కార్యాలయంలో అడగండి.'],['సభ్యులందరి ఆధార్ కార్డులు','పాస్‌పోర్ట్ సైజు ఫోటోలు','పొదుపు, సమావేశాల రికార్డు','సంఘం బ్యాంకు పాస్‌బుక్','సులభమైన వ్యాపార ప్రణాళిక, అవసరమైన మొత్తం']]}}

 const NOMATCH={en:'I could not find a matching topic. Please tap one of the topics below, or ask again with words like pension, ration, health, farming or scholarship.',hi:'मुझे मेल खाता विषय नहीं मिला। कृपया नीचे से कोई विषय चुनें, या पेंशन, राशन, स्वास्थ्य, खेती या छात्रवृत्ति जैसे शब्दों में फिर पूछें।',ta:'பொருந்தும் தலைப்பு கிடைக்கவில்லை. கீழே உள்ள ஒரு தலைப்பைத் தொடுங்கள், அல்லது ஓய்வூதியம், ரேஷன், உடல்நலம், விவசாயம், உதவித்தொகை போன்ற சொற்களில் மீண்டும் கேளுங்கள்.',te:'సరిపోయే అంశం దొరకలేదు. దయచేసి కింది అంశాల్లో ఒకటి నొక్కండి, లేదా పింఛన్, రేషన్, ఆరోగ్యం, వ్యవసాయం, స్కాలర్‌షిప్ వంటి పదాలతో మళ్లీ అడగండి.'};
 const lg=l=>TX[l]?l:'en';
 function schemesFor(l){
  l=lg(l);
  return TOPICS.map(id=>{const k=TX[l].t[id];return{id,name:k[0],summary:k[2],nextSteps:k[3].slice(),documents:k[4].slice()}});
 }
 function getCatalog(l){
  l=lg(l);const u=TX[l].u;
  const hl=HL.work;  // generic fallback helpline: National Career Service toll-free
  return{schemes:schemesFor(l),notice:u.notice,disclaimer:u.disclaimer,documentsNote:u.docsNote,retry:RETRY[l],
   helpline:{callLabel:u.call+': '+hl.num,note:hl.n[l]||hl.n.en,tel:'tel:'+hl.num}};
 }
 function chat(text,l){
  l=lg(l);const q=String(text||'').toLowerCase();
  let best=null,bs=0;
  TOPICS.forEach(id=>{let s=0;KEYS[id].forEach(k=>{if(q.indexOf(k.toLowerCase())>=0)s+=k.length});if(s>bs){bs=s;best=id}});
  if(!best)return{reply:NOMATCH[l],scheme:null};
  const sc=schemesFor(l).find(x=>x.id===best);
  return{reply:sc.summary,scheme:sc};
 }
 return{MAX_MESSAGE,getCatalog,chat};
})();
function topics(){
 const u=ui(),x=TX[lang];
 let h='<div class="top"><button data-act="home">⬅ '+esc(u.home)+'</button><b>Scheme Saheli · '+NAMES[lang]+'</b></div>';
 h+='<div class="langs" role="group" aria-label="Language">'+['ta','te','en','hi'].map(l=>'<button data-act="lang" data-v="'+l+'" aria-pressed="'+(l===lang)+'">'+NAMES[l]+'</button>').join('')+'</div>';
 h+='<h2 id="topH" tabindex="-1">'+esc(x.u.title)+'</h2><p class="tintro">'+esc(x.u.sub)+'</p><div class="tgrid">';
 TOPICS.forEach(id=>{const k=x.t[id];h+='<button type="button" class="tcard" data-act="topic" data-id="'+id+'">'+TICON[id]+'<span class="tx"><b>'+esc(k[0])+'</b><span>'+esc(k[1])+'</span></span></button>'});
 return h+'</div><button type="button" style="width:100%" data-act="ownq">💬 '+esc(x.u.own)+'</button>';
}
function pickTopic(id){
 const inChat=view==='chat'&&cur&&cur.step==='topic',l=inChat?cur.lang:lang;
 if(!TX[l]||!TX[l].t[id])return;
 const conv=inChat?cur:{id:uid(),lang:l,date:new Date().toISOString(),voice:false,step:'topic',topic:null,msgs:[],stored:false};
 if(pending.has(conv))return;
 const bot=topicMsg(id,l);
 conv.msgs.push({r:'user',t:TX[l].t[id][0]},Object.assign({r:'bot'},bot));
 conv.topic=id;conv.step='done';
 if(!conv.stored){convs.unshift(conv);conv.stored=true}
 persist();cur=conv;go('chat');
 const us=document.querySelectorAll('.msg.user'),last=us[us.length-1];if(last)last.scrollIntoView({block:'start'});
 speak(fullText(bot,l),l);
}
function askOwn(){
 loadCat(lang);
 cur={id:uid(),lang,date:new Date().toISOString(),voice:false,step:'topic',topic:null,msgs:[{r:'bot',t:ui().greet}],stored:false};
 go('chat');speak(cur.msgs[0].t,cur.lang);
}

function home(){
 const u=ui();
 let h='<div class="brand">'+ICON.face+'<div><h1>Scheme Saheli</h1><p>'+esc(u.tagline)+'</p></div></div>';
 h+='<div class="langs" role="group" aria-label="Language">'+['ta','te','en','hi'].map(l=>'<button data-act="lang" data-v="'+l+'" aria-pressed="'+(l===lang)+'">'+NAMES[l]+'</button>').join('')+'</div>';
 h+='<button style="width:100%;margin:-8px 0 8px" data-act="test">🔊 '+esc(u.testVoice)+' ('+NAMES[lang]+')</button>';
 h+='<button style="width:100%;margin:0 0 8px" data-act="settings">⚙ '+esc(u.set)+' · '+esc(u.tut)+'</button>';
 h+='<div class="note" id="tts" role="status">'+esc(ttsWarn)+'</div>';
 h+='<button class="big" data-act="start">'+esc(u.start)+'</button>';
 h+='<h2>'+esc(u.how)+'</h2><div class="how">'+[['chat',u.h1],['ear',u.h2],['list',u.h3]].map((x,i)=>'<div class="card">'+ICON[x[0]]+'<b>'+(i+1)+'. '+esc(x[1])+'</b></div>').join('')+'</div>';
 h+='<h2 id="prevH" tabindex="-1" style="margin-top:28px">'+esc(u.prev)+'</h2>';
 if(!convs.length)h+='<div class="card">'+esc(u.none)+'</div>';
 convs.forEach(c=>{h+='<div class="row card" style="padding:8px"><button class="open" data-act="open" data-id="'+esc(c.id)+'"><small>'+esc(fmt(c.date))+' · '+NAMES[c.lang]+(c.voice?' · 🎤 '+esc(u.voiceUsed):'')+'</small>'+esc(preview(c))+'</button><button type="button" class="del" data-act="del" data-id="'+esc(c.id)+'" aria-label="'+esc(u.del+': '+fmt(c.date)+', '+preview(c))+'">🗑 '+esc(u.del)+'</button></div>'});
 return h;
}

function chat(){
 const l=cur.lang,u=T[l];
 let h='<div class="top"><button data-act="home">⬅ '+esc(u.home)+'</button><b>Scheme Saheli · '+NAMES[l]+'</b></div>';
 h+='<div class="log" aria-live="polite">'+cur.msgs.map((m,i)=>msgEl(m,i,l)).join('')+'</div>';
 h+='<div class="note" id="tts" role="status">'+esc(ttsWarn)+'</div>';
 if(pending.has(cur))h+='<div class="note" role="status">'+esc(u.thinking)+'</div>';
 if(cur.step==='topic'){
  h+='<p><b>'+esc(u.topics)+'</b></p><div class="chips">'+TOPICS.map(id=>'<button type="button" data-act="topic" data-id="'+id+'">'+esc(TX[l].t[id][0])+'</button>').join('')+'</div>';
 }else{
  h+='<p class="saved">'+esc(u.saved)+'</p><button class="big" style="margin-bottom:8px" data-act="start">'+esc(u.newchat)+'</button>';
 }
 if(cur.step!=='done'){
  h+='<div class="micwrap"><button class="mic" id="mic" data-act="mic" aria-label="'+esc(u.mic)+'">'+ICON.mic+'</button><div><b>'+esc(u.mic)+'</b></div></div>';
  h+='<div class="note" id="note" role="status">'+(SR?(micBlocked?esc(u.micDenied+' '+u.micHelp):''):esc(u.noVoice))+'</div>';
   if(SR&&INSEC)h+='<p class="saved">'+esc(u.micInsecure)+'</p>';
  h+='<form class="input" id="chatForm" action="#" novalidate><input id="txt" name="q" type="text" maxlength="'+(window.SahelCatalog?.MAX_MESSAGE||500)+'" enterkeyhint="send" placeholder="'+esc(u.ph)+'" aria-label="'+esc(u.ph)+'" autocomplete="off"><button class="send" type="submit">'+esc(u.send)+'</button></form>';
 }
 return h;
}

function saved(){
 const u=T[cur.lang];
 let h='<div class="top"><button data-act="home">⬅ '+esc(T[lang].home)+'</button><b>'+esc(fmt(cur.date))+'</b></div>';
 h+='<div class="log">'+cur.msgs.map((m,i)=>msgEl(m,i,cur.lang)).join('')+'</div>';
 h+='<div class="note" id="tts" role="status">'+esc(ttsWarn)+'</div>';
 h+='<div class="chips">'+'<button data-act="listenall">🔊 '+esc(u.listenAll)+'</button><button data-act="stop">⏹ '+esc(u.stop)+'</button>'+'<button type="button" class="del" data-act="del" data-id="'+esc(cur.id)+'" aria-label="'+esc(u.del+': '+fmt(cur.date))+'">🗑 '+esc(u.del)+'</button></div>';
 return h;
}

function settings(){
 const u=ui(),vs=SYN?speechSynthesis.getVoices():[],v=SYN?findVoice(lang):null;
 let h='<div class="top"><button data-act="home">⬅ '+esc(u.home)+'</button><b>'+esc(u.set)+'</b></div>';
 h+='<div class="langs" role="group" aria-label="Language">'+['ta','te','en','hi'].map(l=>'<button data-act="lang" data-v="'+l+'" aria-pressed="'+(l===lang)+'">'+NAMES[l]+'</button>').join('')+'</div>';
 h+='<h2 id="tutH" tabindex="-1">'+esc(u.tut)+'</h2>'+[u.i1,u.i2,u.i3].map(x=>'<div class="card">'+esc(x)+'</div>').join('');
 const pm={granted:u.pg,prompt:u.pp,denied:u.pd}[micPerm]||u.pu;
 let L=[!SYN?u.noSyn:v?u.ttsOk+v.name+' ('+v.lang+')':u.noTts,SR?u.srOk:u.noVoice,u.perm+pm];
 if(micBlocked||micPerm==='denied')L.push(u.micHelp);
 if(SR&&INSEC)L.push(u.micInsecure);
 h+='<div class="card"><b>'+esc(u.stT)+'</b><ul class="stl">'+L.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
 h+='<h3>'+esc(u.plat)+'</h3><div class="langs" role="group" aria-label="'+esc(u.plat)+'">'+[['a','Android'],['w','Windows']].map(x=>'<button data-act="plat" data-v="'+x[0]+'" aria-pressed="'+(tplat===x[0])+'">'+x[1]+'</button>').join('')+'</div>';
 const d=tplat==='a'?u.and:u.win;
 h+=u.caps.map((c,i)=>'<div class="card step"><h3><span class="num">'+(i+1)+'</span>'+esc(c)+'</h3><svg viewBox="0 0 120 90" role="img" aria-label="'+esc(u.alts[i])+'"><rect x="1" y="1" width="118" height="88" rx="14" fill="#fff" stroke="#BFD9D2" stroke-width="2"/>'+ART[i]+'</svg><p>'+esc(d[i].replace('{T}',u.testVoice).replace('{S}',u.mic))+'</p>'+(i===3?'<button style="width:100%" data-act="test">🔊 '+esc(u.testVoice)+'</button><div class="note" id="tts" role="status">'+esc(ttsWarn)+'</div>':'')+'</div>').join('');
 return h+'<button class="big" data-act="home">⬅ '+esc(u.home)+'</button>';
}
function homeStatus(){
 if(!SYN)return ui().noSyn;
 return(speechSynthesis.getVoices().length&&!findVoice(lang))?ui().noTts:'';
}
function render(keep){
 if(view==='home')ttsWarn=homeStatus();
 $('#app').innerHTML=view==='home'?home():view==='chat'?chat():view==='topics'?topics():view==='settings'?settings():saved();
 document.documentElement.lang=lang;
 syncMic();
 if(keep!==true)window.scrollTo(0,view==='chat'?document.body.scrollHeight:0);
}
function go(v){
 stopAll();ttsWarn='';const prev=view;view=v;
 try{render()}catch(err){
  console.error('Screen "'+v+'" failed to render:',err);
  view=prev==='chat'||prev==='saved'?'home':prev;
  try{render()}catch(e2){console.error(e2)}
 }
}
function note(t){const n=$('#note');if(n)n.textContent=t}

function newConv(){
 loadCat(lang);
 go('topics');
 const hd=$('#topH');if(hd)hd.focus({preventScroll:true});
}
async function handle(text,byVoice,forced){
 text=text.trim();
 if(!text||!cur||pending.has(cur))return;
 const conv=cur,l=conv.lang;
 conv.msgs.push({r:'user',t:text});
 if(byVoice)conv.voice=true;
 if(!conv.stored){convs.unshift(conv);conv.stored=true}
 persist();stopRecOnly();
 pending.add(conv);render();
 let m;
 try{
  const sc=forced&&catFor(l).schemes.find(x=>x.id===forced);   // topic button: data already loaded from /api/schemes
  m=sc?botFromScheme(sc):botFromChat(await askChat(text,l));   // typed or spoken text: POST /api/chat
 }catch(e){m={t:SahelCatalog.getCatalog(l).retry}}
 pending.delete(conv);
 conv.msgs.push(Object.assign({r:'bot'},m));
 if(m.topic){conv.topic=m.topic;conv.step='done'}
 persist();
 if(cur===conv&&view==='chat'){render();speak(fullText(m,l),l)}
}
let pendingDel=null,delOpener=null;
function openDel(id,opener){
 const c=convs.find(x=>x.id===id);if(!c)return;
 pendingDel=id;delOpener=opener;
 const u=T[view==='saved'&&cur?cur.lang:lang];
 $('#dlgT').textContent=u.delConfirm;
 $('#dlgD').textContent=fmt(c.date)+' · '+NAMES[c.lang]+' — '+preview(c);
 $('#dlgCancel').textContent=u.cancel;$('#dlgOk').textContent='🗑 '+u.del;
 $('#dlg').hidden=false;$('#dlgCancel').focus();
}
function closeDel(restore){
 $('#dlg').hidden=true;pendingDel=null;
 if(restore&&delOpener&&document.body.contains(delOpener))delOpener.focus();
 delOpener=null;
}
function confirmDel(){
 const id=pendingDel;if(id===null)return;
 convs=convs.filter(c=>c.id!==id);   // removes only this conversation
 persist();
 closeDel(false);
 if(cur&&cur.id===id){cur=null;go('home')}else render();
 const h=$('#prevH');if(h)h.focus();
}
function stopRecOnly(){if(micState==='listening'||micState==='starting')haltRec(false)}
function watchPerm(){
 try{navigator.permissions.query({name:'microphone'}).then(p=>{
  micPerm=p.state;if(p.state==='denied')micBlocked=true;
  p.onchange=()=>{micPerm=p.state;if(p.state!=='denied'){micBlocked=false;if(micState==='idle')note('')}else micBlocked=true;if(view==='settings')render(true)};
  if(view==='settings')render(true);
 }).catch(()=>{})}catch(e){}
}
function syncMic(){
 const b=$('#mic');if(!b)return;
 const on=micState==='listening';
 b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.setAttribute('aria-busy',micState==='starting'||micState==='stopping');
 if(cur)b.setAttribute('aria-label',on?T[cur.lang].stop:T[cur.lang].mic);
}
function haltRec(abort){
 if(!recog||micState==='idle')return;
 micCtx.userStopped=true;micState='stopping';
 try{abort?recog.abort():recog.stop()}catch(e){}
 clearTimeout(micTimer);micTimer=setTimeout(()=>{if(micState==='stopping'){micState='idle';syncMic()}},2500);
 syncMic();
}
function getRec(){
 if(recog)return recog;
 const r=new SR();r.continuous=false;r.interimResults=false;r.maxAlternatives=1;
 r.onstart=()=>{micState='listening';syncMic();note('🎤 '+T[micCtx.l].listening)};
 r.onresult=e=>{
  const t=(e.results[0]&&e.results[0][0]?e.results[0][0].transcript:'').trim();
  if(!t){micCtx.failed=true;note(T[micCtx.l].voiceFail);return}
  micCtx.got=true;handle(t,true);
 };
 r.onerror=e=>{
  const c=e.error,u=T[micCtx.l||'en'];
  if(c==='aborted')return;
  micCtx.failed=true;
  if(c==='not-allowed'||c==='service-not-allowed'){micBlocked=true;note(u.micDenied+' '+u.micHelp)}
  else note(c==='audio-capture'?u.micNone:c==='network'?u.micNet:c==='language-not-supported'?u.micLang:u.voiceFail);
 };
 r.onend=()=>{
  micState='idle';syncMic();
  if(!micCtx.got&&!micCtx.failed){note(micCtx.userStopped?'':T[micCtx.l].voiceFail)}
 };
 recog=r;return r;
}
function mic(){
 const u=T[cur.lang];
 if(!SR){note(u.noVoice);return}
 if(micState==='starting'||micState==='stopping')return;   // no double starts
 if(micState==='listening'){haltRec(false);return}          // tap again = stop
 if(micBlocked||micPerm==='denied'){note(u.micDenied+' '+u.micHelp);return}   // never re-prompt
 stopSpeech();
 const r=getRec();
 micCtx={l:cur.lang,got:false,failed:false,userStopped:false};
 r.lang=LC[cur.lang];
 micState='starting';syncMic();note('');
 try{r.start()}catch(e){micState='idle';syncMic();note(u.voiceFail)}
}
watchPerm();

document.addEventListener('click',e=>{
 if(e.target.id==='dlg'){closeDel(true);return}
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act;
 if(a==='lang'){lang=b.dataset.v;loadCat(lang);try{localStorage.setItem('saheli_lang',lang)}catch(x){}render()}
 else if(a==='start')newConv();
 else if(a==='topic')pickTopic(b.dataset.id);
 else if(a==='ownq')askOwn();
 else if(a==='home')go('home');
 else if(a==='chip')handle(b.dataset.v,false,b.dataset.t);
 else if(a==='mic')mic();
 else if(a==='open'){cur=convs.find(c=>String(c.id)===b.dataset.id);if(cur)go('saved')}
 else if(a==='del')openDel(b.dataset.id,b);
 else if(a==='delcancel')closeDel(true);
 else if(a==='delok')confirmDel();
 else if(a==='listen'){const m=cur.msgs[+b.dataset.i];speak(fullText(m,cur.lang),cur.lang)}
 else if(a==='listenall')speak(cur.msgs.map(m=>fullText(m,cur.lang)).join('. '),cur.lang);
 else if(a==='stop')stopAll();
 else if(a==='stopspeak'){stopSpeech();setTts('')}
 else if(a==='chk'){
  const i=+b.dataset.i,j=+b.dataset.j,m=cur&&cur.msgs[i];if(!m||!m.docs)return;
  if(!Array.isArray(m.checked))m.checked=m.docs.map(()=>false);
  m.checked[j]=!m.checked[j];persist();render(true);
  const nb=document.querySelector('[data-act="chk"][data-i="'+i+'"][data-j="'+j+'"]');if(nb)nb.focus({preventScroll:true});
 }
 else if(a==='copy'||a==='wa'){
  const m=cur&&cur.msgs[+b.dataset.i];if(!m||!m.docs)return;
  const l=cur.lang,u=T[l],out=b.closest('.msg').querySelector('.cn'),txt=listText(m,l);
  if(a==='copy')copyText(txt).then(ok=>{if(out)out.textContent=ok?u.copied:u.copyFail});
  else{
   if(out)out.textContent=u.waOpen;
   const lk=document.createElement('a');lk.href='https://wa.me/?text='+encodeURIComponent(txt);lk.target='_blank';lk.rel='noopener';
   document.body.appendChild(lk);lk.click();lk.remove();
  }
 }
 else if(a==='test')speak(ui().greet,lang);
 else if(a==='settings')go('settings');
 else if(a==='plat'){tplat=b.dataset.v;render(true)}
});
document.addEventListener('submit',e=>{
 e.preventDefault();
 if(e.target.id==='chatForm'&&cur){const i=e.target.querySelector('#txt');if(!pending.has(cur)){const v=i.value;i.value='';handle(v,false)}}
});
if(SYN)speechSynthesis.addEventListener('voiceschanged',()=>{if(view==='home'||view==='settings')render(true)});
document.addEventListener('keydown',e=>{
 if(pendingDel!==null){
  if(e.key==='Escape'){closeDel(true);return}
  if(e.key==='Tab'){const a=$('#dlgCancel'),o=$('#dlgOk');e.preventDefault();(document.activeElement===a?o:a).focus();return}
 }
});
loadCat(lang);
render();
</script>
